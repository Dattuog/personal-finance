name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: finpilot_test
          POSTGRES_USER: finpilot
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finpilot -d finpilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://finpilot@localhost:5432/finpilot_test
      AUTH_SECRET: ${{ github.sha }}-${{ github.run_id }}-ci
      NEXTAUTH_URL: http://localhost:3000
      EMAIL_SERVER: smtp://localhost:1025
      EMAIL_FROM: FinPilot CI <no-reply@localhost>
      AI_PROVIDER: gemini
      AI_MONTHLY_USER_REQUEST_LIMIT: 20
      AI_MAX_OUTPUT_TOKENS: 1500
      GEMINI_API_KEY: ci-placeholder-not-a-real-key
      GEMINI_MODEL: gemini-3.5-flash-lite
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:secrets
      - run: pnpm audit --prod --audit-level high
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm prisma migrate deploy
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
